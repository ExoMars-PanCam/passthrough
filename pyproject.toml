[project]
name = "passthrough"
version = "0.4.0"
description = "Passthrough - Template-Driven PDS4 Data Product Generation"
authors = [
    { name = "Ariel Ladegaard", email = "arl13@aber.ac.uk" },
    { name = "Alun Jones", email = "alun.jones@aber.ac.uk" }
]
readme = "README.md"
license = "MIT"
keywords = [
    "PDS",
    "PDS4",
    "template",
    "framework",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

requires-python = ">=3.8,<4"
dependencies = [
    "lxml>=4.5.0,<5",
]

[project.optional-dependencies]
pds4_tools = ["pds4_tools>=1.2,<2"]

[project.urls]
Repository = "https://github.com/ExoMars-PanCam/passthrough"

[project.entry-points."passthrough.extensions"]
exm = "passthrough.extensions.exm"
file = "passthrough.extensions.file"
pt = "passthrough.extensions.pt"

[dependency-groups]
dev = [
    "pytest>=3.5",
    "black>=20.8b1,<21",
    "isort>=5.10.1,<6",
    "ruff>=0.15.8",
    "mkdocs-material>=7.1.3,<8",
    "mkdocs-section-index>=0.3.0,<0.4",
    "mkdocstrings>=0.15.0,<0.16",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
(
  /(
    | \.git
    | build
    | dist
  )/
)
'''
experimental-string-processing = true

[tool.isort] # black compatibility
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
